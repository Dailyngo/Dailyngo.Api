  dailyngo-redis:
    image: redis
    container_name: dailyngo-redis
    ports:
      - 6379:6379
    restart: always
    hostname: "dailyngo-redis"
    networks:
      - dailyngo

  dailyngo-rabbitmq: # login guest:guest
    image: rabbitmq:3-management
    hostname: "rabbitmq"
    labels:
      NAME: "rabbitmq"
    container_name: "dailyngo-rabbitmq"
    ports:
    - "5672:5672"
    - "15672:15672"
    restart: always
    networks:
      - dailyngo


volumes:
  postgres-data:
    driver: local
  mongo-data:
    driver: local