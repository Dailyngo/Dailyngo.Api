
networks:
  dailyngo:
   external: true
  
services:
  dailyngo-db:
    image: postgres
    container_name: dailyngo-db
    hostname: "dailyngo-db"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: P@ssw0rd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dailyngo
    restart: always

  dailyngo-mongodb:
    image: mongo:4.4
    container_name: dailyngo-mongodb
    hostname: "dailyngo-mongodb"
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Password123
    volumes:
      - mongo-data:/data/db
    networks:
      - dailyngo
    restart: always
    
