services:
  dailyngo.api:
    image: dailyngo.api
    build:
      context: .
      dockerfile: EveryDaily.Api/Dockerfile
    ports:
        - "5000:8080"
    environment: 
        - ASPNETCORE_ENVIRONMENT=Docker
    networks:
      - dailyngo
    hostname: dailyngo.api
    restart: always
    
networks:
  dailyngo:
    external: true
