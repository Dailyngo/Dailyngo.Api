name: CI Build Push Image For Dailyngo.Api

on:
  push:
    branches: [ "develop" ]
    paths-ignore:
      - README.md
      - .vscode/**
      - .gitignore
  pull_request:
    branches: [ "develop" ]
    paths-ignore:
      - README.md
      - .vscode/**
      - .gitignore

jobs:
 build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      -
        name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./EveryDaily.Api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dailyngo.api:latest, ${{ secrets.DOCKERHUB_USERNAME }}/dailyngo.api:${{ github.run_number }}
   
 deployment:
    runs-on: self-hosted 
    needs: build 
    steps:
      -
        name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Deployments
        run: |
          docker network create dailyngo || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dailyngo.api:latest
          docker stop dailyngo-api || true
          docker rm dailyngo-api || true
          docker run -d \
            --name dailyngo-api \
            -p 5000:8080 \
            -e ASPNETCORE_ENVIRONMENT=Docker \
            --hostname dailyngo.api \
            --network dailyngo \
            --restart always \
            ${{ secrets.DOCKERHUB_USERNAME }}/dailyngo.api:latest
          docker system prune -f --filter "until=24h"