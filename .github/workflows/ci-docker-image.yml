name: CI Build Push Image For Dailyngo.Api

on:
  push:
    branches: [ "develop" ]
    paths-ignore:
      - README.md
      - .vscode/**
      - .gitignore
  pull_request:
    branches: [ "develop" ]
    paths-ignore:
      - README.md
      - .vscode/**
      - .gitignore

jobs:
 docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      -
        name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./EveryDaily.Api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dailyngo.api:latest, ${{ secrets.DOCKERHUB_USERNAME }}/dailyngo.api:${{ github.run_number }}
   
# Self-hosted sunucuya deploy işlemi (Yeni eklenen job)
 deploy-to-selfhosted:
    runs-on: self-hosted  # Self-hosted runner kullanılıyor
    needs: docker  # Önce 'docker' job'ının tamamlanmasını bekler
    steps:
      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # SSH ile sunucuya bağlan ve container'ı güncelle
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SSH_USER}@${SERVER_IP} "
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dailyngo.api:latest && \
            docker stop dailyngo-api || true && \
            docker rm dailyngo-api || true && \
            docker run -d --name dailyngo-api -p 8080:80 ${{ secrets.DOCKERHUB_USERNAME }}/dailyngo.api:latest"